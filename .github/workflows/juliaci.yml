name: Julia CI

on:
  push: {branches: [main,master]}
  pull_request: {types: [opened,synchronize,reopened,ready_for_review,converted_to_draft]}
  issue_comment: {types: [created]}
  workflow_dispatch: {inputs: {feature: {type: choice, description: What to run, options: [DocDeploy,LintAndTest,TagBot]}}}

jobs:
  julia-ci:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    with:
      include-all-compatible-minor-versions: true
      include-rc-versions: true
      # DuckDB has no working 32-bit support: the x86 libduckdb crashes with an
      # access violation inside duckdb_column_name, and DuckDB.jl only defines
      # get_parameter(::BindInfo, ::Int64), which no longer matches when Int is
      # Int32. Every test errored on those legs, on main as well as here.
      include-windows-x86: false
      include-linux-x86: false
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
